<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Course — Thierry Morin</title>
  <meta name="description" content="Course de voitures sur papier quadrillé : un vecteur de vitesse, un point à choisir, et le premier qui passe la ligne gagne.">
  <meta name="theme-color" content="#0d0e11">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThyApp">

  <style>
    :root {
      --bg: #0d0e11;
      --ink: #ebe8e1;
      --muted: #8b8b93;
      --lilac: #b7a4ea;
      --amber: #f6b564;
      --coral: #ee7f73;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .wash { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); mix-blend-mode: screen; opacity: .22; }
    .blob.lilac { width: 60vmax; height: 50vmax; right: -22vmax; top: -14vmax; background: radial-gradient(closest-side, var(--lilac), transparent 72%); }
    .blob.amber { width: 46vmax; height: 40vmax; right: -14vmax; top: 34vh; background: radial-gradient(closest-side, var(--amber), transparent 72%); }
    .blob.coral { width: 38vmax; height: 34vmax; left: -16vmax; bottom: -16vmax; background: radial-gradient(closest-side, var(--coral), transparent 72%); }

    .page {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    body.locked .content { display: none; }
    .content { width: 100%; max-width: 640px; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    main .thy-gate { margin: 0; }

    header {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--muted);
    }
    header .back {
      justify-self: start;
      color: var(--ink);
      background: none;
      border: 0;
      height: auto;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      text-decoration: none;
      padding: 12px 12px 12px 0;
      cursor: pointer;
      transition: color .3s;
    }
    header .back:hover, header .back:focus-visible { color: var(--amber); outline: none; }
    header h1 { font: inherit; color: var(--ink); white-space: nowrap; }

    button {
      appearance: none;
      cursor: pointer;
      height: 52px;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .26em;
      text-transform: uppercase;
      padding-left: .26em;
      color: var(--ink);
      background: rgba(13, 14, 17, .55);
      border: 1px solid rgba(235, 232, 225, .28);
      transition: border-color .3s, color .3s, opacity .3s, transform .15s, background .3s;
    }
    button:hover:not(:disabled), button:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
    button:active:not(:disabled) { transform: scale(.985); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button.primary {
      border: 0;
      color: var(--bg);
      font-weight: 700;
      background: linear-gradient(100deg, var(--lilac), var(--amber) 55%, var(--coral));
    }
    button.primary:hover:not(:disabled), button.primary:focus-visible { color: var(--bg); filter: brightness(1.1); }
    button.on { border-color: var(--amber); color: var(--amber); background: rgba(246, 181, 100, .1); }

    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .label { font-family: var(--mono); font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .row { display: grid; gap: 8px; }

    /* ---------- Réglages ---------- */
    .tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .track {
      height: auto;
      padding: 8px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: .14em;
    }
    .track canvas { width: 100%; aspect-ratio: 3 / 4; border-radius: 2px; background: #cfd3c4; display: block; }
    .stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
    .stepper #lapsBox { text-align: center; }
    .stepper output { text-align: center; font-family: var(--serif); font-size: 26px; }
    .stepper .note { text-align: center; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .names { display: grid; gap: 8px; }
    .name { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
    .caricon { display: block; flex: none; }
    .whocar { display: inline-flex; flex: none; }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(235, 232, 225, .6); display: inline-block; flex: none; }
    input[type=text], select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      font: inherit;
      font-size: 16px;   /* évite le zoom automatique sur iPhone */
      color: var(--ink);
      background: rgba(13, 14, 17, .6);
      border: 1px solid rgba(235, 232, 225, .28);
      border-radius: 2px;
    }
    input[type=text]:focus, select:focus { outline: none; border-color: var(--amber); }
    .actions button:not(.primary) { font-size: 10.5px; letter-spacing: .14em; }
    .actions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-top: auto; }

    /* ---------- Course ---------- */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .who { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 22px; min-width: 0; }
    .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .speed { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-align: right; white-space: nowrap; }
    .speed b { color: var(--ink); font-weight: 400; }
    .stage { position: relative; flex: 1; min-height: 220px; border: 1px solid rgba(246, 181, 100, .45); border-radius: 2px; overflow: hidden; background: #cfd3c4; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
    .status { min-height: 2.6em; text-align: center; font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.3; color: var(--muted); }
    .status.warn { color: var(--coral); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .chip {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
      border: 1px solid rgba(235, 232, 225, .18); border-radius: 2px; max-width: 48%;
    }
    .chip .dot { width: 12px; height: 12px; border-width: 1.5px; }
    .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.cur { color: var(--ink); border-color: var(--amber); }
    .chip.out { opacity: .55; }
    .playbar { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    .playbar button { height: 52px; }

    /* ---------- Résultats et Hall of Fame ---------- */
    h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; text-align: center; }
    h2 em { font-style: italic; color: var(--amber); }
    .ranks { list-style: none; display: grid; gap: 8px; }
    .rank {
      display: grid; grid-template-columns: 34px 36px 1fr auto; gap: 10px; align-items: center;
      padding: 12px 14px; border: 1px solid rgba(235, 232, 225, .2); border-radius: 2px; background: rgba(13, 14, 17, .5);
    }
    .rank .pos { font-family: var(--serif); font-size: 24px; color: var(--amber); }
    .rank .nm { font-family: var(--serif); font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank .tm { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-align: right; white-space: nowrap; }
    .rank .tm small { display: block; color: var(--muted); font-size: 9.5px; letter-spacing: .12em; margin-top: 2px; }
    .rank.dnf { opacity: .55; }
    .rank.dnf .pos { color: var(--muted); }
    .empty { text-align: center; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--muted); padding: 30px 10px; }
    .filters { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true">
    <div class="blob lilac"></div>
    <div class="blob amber"></div>
    <div class="blob coral"></div>
  </div>

  <div class="page">
    <header>
      <button class="back" id="back" type="button">← Menu</button>
      <h1>Course</h1>
      <span></span>
    </header>

    <main style="width:100%;max-width:640px;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px">
      <div id="gate" hidden></div>

      <div class="content">

        <!-- Réglages -->
        <section class="screen scroll" id="setup">
          <div>
            <div class="label">Circuit</div>
            <div class="tracks" id="tracks"></div>
          </div>
          <div>
            <div class="label">Tours</div>
            <div class="stepper">
              <button id="lapsMinus" type="button" aria-label="Moins de tours">−</button>
              <div id="lapsBox"><output id="laps">2</output></div>
              <button id="lapsPlus" type="button" aria-label="Plus de tours">+</button>
            </div>
          </div>
          <div>
            <div class="label">Joueurs</div>
            <div class="seg" id="seg"></div>
            <div class="names" id="names" style="margin-top:10px"></div>
          </div>
          <div class="actions">
            <button class="primary" id="go" type="button">Course !</button>
            <button id="hofBtn" type="button">Hall of Fame</button>
          </div>
        </section>

        <!-- Course -->
        <section class="screen" id="play" hidden>
          <div class="bar">
            <div class="who"><span class="whocar" id="whoDot"></span><span id="whoName"></span></div>
            <div class="speed" id="speed"></div>
          </div>
          <div class="stage" id="stage"><canvas id="cv" aria-label="Circuit de course sur papier quadrillé" role="img"></canvas></div>
          <p class="status" id="status" role="status"></p>
          <div class="chips" id="chips"></div>
          <div class="playbar">
            <button id="view" type="button">Vue d’ensemble</button>
            <button class="primary" id="ok" type="button" disabled>Valider</button>
          </div>
        </section>

        <!-- Résultats -->
        <section class="screen scroll" id="result" hidden>
          <h2 id="resTitle"></h2>
          <ol class="ranks" id="ranks"></ol>
          <div class="actions" style="margin-top:auto">
            <button class="primary" id="again" type="button">Rejouer</button>
            <button id="hofBtn2" type="button">Hall of Fame</button>
          </div>
        </section>

        <!-- Hall of Fame -->
        <section class="screen scroll" id="hof" hidden>
          <h2>Hall of <em>Fame</em></h2>
          <div class="filters">
            <select id="hofTrack" aria-label="Circuit"></select>
            <select id="hofLaps" aria-label="Nombre de tours"></select>
          </div>
          <ol class="ranks" id="hofList"></ol>
          <p class="empty" id="hofEmpty" hidden>Aucun temps sur ce circuit pour l’instant.</p>
        </section>

      </div>
    </main>
  </div>

  <script src="firebase-config.js"></script>
  <script src="db.js"></script>
  <script src="pen.js"></script>
  <script>
    (function () {
      'use strict';

      var DB = window.ThyDB;
      var $ = function (id) { return document.getElementById(id); };

      // ======================================================================
      //  Circuits
      //  Chaque circuit est une courbe lisse passant par des points de contrôle, avec une demi-largeur de route.
      //  Les quatre premiers points sont alignés à l'horizontale : c'est la ligne droite de départ.
      //  Coordonnées en « carreaux » (y vers le bas).
      // ======================================================================
      var TRACKS = [
        {
          id: 'ovale', nom: 'Ovale', closed: true, hw: 4.4,
          pts: [[28, 8], [38, 8], [48, 8], [54, 14], [56, 24], [56, 40], [56, 52], [50, 62], [38, 66], [26, 66], [14, 62], [8, 52], [8, 40], [8, 24], [10, 14], [18, 8]]
        },
        {
          id: 'grand-prix', nom: 'Grand Prix', closed: true, hw: 4.2,
          pts: [[26, 8], [36, 8], [46, 8], [56, 12], [60, 22], [52, 30], [42, 32], [36, 40], [44, 48], [56, 52], [58, 62], [48, 70], [32, 72], [18, 68], [10, 58], [14, 48], [22, 42], [14, 34], [8, 24], [10, 14], [16, 8]]
        },
        {
          id: 'slalom', nom: 'Slalom A→B', closed: false, hw: 4.2,
          pts: [[8, 8], [18, 8], [28, 8], [40, 10], [48, 18], [42, 27], [28, 31], [16, 37], [12, 47], [20, 56], [34, 60], [46, 66], [46, 77], [36, 84], [26, 90], [26, 100], [34, 106], [44, 108], [52, 108], [60, 108], [68, 108]]
        }
      ];
      var TRACK_BY_ID = {};

      function catmull(pts, closed, per) {
        var n = pts.length, out = [], segs = closed ? n : n - 1;
        function P(i) {
          if (closed) return pts[((i % n) + n) % n];
          if (i < 0) return [2 * pts[0][0] - pts[1][0], 2 * pts[0][1] - pts[1][1]];
          if (i >= n) return [2 * pts[n - 1][0] - pts[n - 2][0], 2 * pts[n - 1][1] - pts[n - 2][1]];
          return pts[i];
        }
        function cr(a, b, c, d, t) {
          return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
        }
        for (var s = 0; s < segs; s++) {
          var p0 = P(s - 1), p1 = P(s), p2 = P(s + 1), p3 = P(s + 2);
          for (var k = 0; k < per; k++) {
            var t = k / per;
            out.push([cr(p0[0], p1[0], p2[0], p3[0], t), cr(p0[1], p1[1], p2[1], p3[1], t)]);
          }
        }
        if (!closed) out.push(pts[n - 1].slice());
        return out;
      }

      function prepare(def) {
        var line = catmull(def.pts, def.closed, 14);
        var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
        line.forEach(function (p) {
          minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]);
          miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]);
        });
        var m = def.hw + 2;
        var tr = {
          id: def.id, nom: def.nom, closed: def.closed, hw: def.hw, line: line,
          bbox: { x0: minx - m, y0: miny - m, x1: maxx + m, y1: maxy + m }
        };
        // ligne d'arrivée
        var F, t;
        if (def.closed) {
          F = line[0].slice();
          var a = line[line.length - 1], b = line[1];
          t = norm([b[0] - a[0], b[1] - a[1]]);
        } else {
          var acc = 0, i = line.length - 1;
          while (i > 1 && acc < 14) { acc += dist(line[i], line[i - 1]); i--; }
          F = line[i].slice();
          t = norm([line[i + 1][0] - line[i - 1][0], line[i + 1][1] - line[i - 1][1]]);
        }
        tr.arc = [0];
        for (var q = 1; q < line.length; q++) tr.arc.push(tr.arc[q - 1] + dist(line[q], line[q - 1]));
        tr.total = tr.arc[line.length - 1] + (def.closed ? dist(line[line.length - 1], line[0]) : 0);
        tr.finish = { x: F[0], y: F[1], tx: t[0], ty: t[1], nx: -t[1], ny: t[0] };
        // ligne de départ (circuit ouvert : un peu après le premier point)
        tr.startLine = def.closed ? tr.finish : { x: line[0][0] + 2.5, y: line[0][1], tx: 1, ty: 0, nx: 0, ny: 1 };
        return tr;
      }
      function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
      function norm(v) { var l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; }

      function distToTrack(tr, x, y) {
        var L = tr.line, n = L.length, best = 1e9, segs = tr.closed ? n : n - 1;
        for (var i = 0; i < segs; i++) {
          var a = L[i], b = L[(i + 1) % n];
          var dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
          var u = l2 ? ((x - a[0]) * dx + (y - a[1]) * dy) / l2 : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          var d = Math.hypot(x - (a[0] + u * dx), y - (a[1] + u * dy));
          if (d < best) best = d;
        }
        return best;
      }
      // Abscisse curviligne (distance le long de l'axe de la route) du point de l'axe le plus proche de (x, y)
      function arcOf(tr, x, y) {
        var L = tr.line, n = L.length, segs = tr.closed ? n : n - 1, best = 1e9, bs = 0;
        for (var i = 0; i < segs; i++) {
          var a = L[i], b = L[(i + 1) % n];
          var dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
          var u = l2 ? ((x - a[0]) * dx + (y - a[1]) * dy) / l2 : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          var d = Math.hypot(x - (a[0] + u * dx), y - (a[1] + u * dy));
          if (d < best) { best = d; bs = tr.arc[i] + u * Math.sqrt(l2); }
        }
        return bs;
      }
      // différence d'abscisses ramenée dans ]-L/2 ; L/2] sur un circuit fermé (positif = en aval)
      function wrapDiff(tr, d) {
        if (!tr.closed) return d;
        var h = tr.total / 2;
        return ((d + h) % tr.total + tr.total) % tr.total - h;
      }
      function pointAt(tr, s) {
        var L = tr.line, n = L.length;
        if (tr.closed) s = ((s % tr.total) + tr.total) % tr.total; else s = Math.max(0, Math.min(tr.total, s));
        var i = 0;
        while (i < n - 1 && tr.arc[i + 1] <= s) i++;
        var a = L[i], b = L[(i + 1) % n], l = dist(a, b) || 1, u = Math.max(0, Math.min(1, (s - tr.arc[i]) / l));
        return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
      }
      function subLine(tr, s0, s1) {
        var out = [], step = 0.5;
        for (var s = s0; s < s1; s += step) out.push(pointAt(tr, s));
        out.push(pointAt(tr, s1));
        return out;
      }
      function onRoad(tr, x, y) { return distToTrack(tr, x, y) <= tr.hw + 1e-9; }

      // Sur un circuit fermé, la ligne sert au départ ET à l'arrivée : les voitures démarrent juste derrière,
      // le premier passage lance le chrono des tours (compteur à −1), puis chaque passage termine un tour.
      // Positions de départ : côte à côte, juste derrière la ligne de départ (2 carreaux avant l'arrivée sur un circuit fermé)
      function startPositions(tr, n) {
        var S = tr.closed ? { x: tr.finish.x - 2, y: tr.finish.y } : { x: tr.line[0][0] + 1, y: tr.line[0][1] };
        var res = [];
        for (var i = 0; i < n; i++) {
          var off = (i - (n - 1) / 2) * 2;
          var px = Math.round(S.x), py = Math.round(S.y + off);
          var guard = 0;
          while (!onRoad(tr, px, py) && guard++ < 6) py += py > S.y ? -1 : 1;
          res.push([px, py]);
        }
        return res;
      }

      // ======================================================================
      //  Règles
      // ======================================================================
      var COLORS = ['#2f5fd0', '#d33a3a', '#2e9a55', '#1d1d22'];
      var COLOR_NAMES = ['bleu', 'rouge', 'vert', 'noir'];
      var game = null;

      // Résout un déplacement de pos vers target. Types :
      //   ok       : reste sur la route
      //   exit     : quitte la route ; la voiture s'arrête là où elle arrive (hors piste), vitesse nulle
      //   off      : manœuvre hors piste (vitesse 2 maxi)
      //   reentry  : retour sur la route, en amont de l'endroit de la sortie
      //   illegal  : sortie puis retour sur la route, traversée de la route, ou retour en aval de la sortie
      //   toofast  : hors piste, plus de 2 carreaux par tour
      //   blocked  : case occupée par une autre voiture
      var MAX_OFF = 2;
      function resolveMove(g, pl, target) {
        var tr = g.track, a = pl.pos, b = target;
        var vx = b[0] - a[0], vy = b[1] - a[1];

          var c = document.createElement('canvas'); c.width = 180; c.height = 240;
          var t = document.createElement('span'); t.textContent = d.nom;
          b.appendChild(c); b.appendChild(t);
          b.addEventListener('click', function () { settings.track = i; saveSettings(); renderSetup(); });
          box.appendChild(b);
          var tr = TRACK_BY_ID[d.id], bb = tr.bbox;
          var s = Math.min(180 / (bb.x1 - bb.x0), 240 / (bb.y1 - bb.y0));
          drawTrack(c.getContext('2d'), tr, { cx: (bb.x0 + bb.x1) / 2, cy: (bb.y0 + bb.y1) / 2, s: s }, 180, 240, false);
        });
        var closed = TRACK_BY_ID[TRACKS[settings.track].id].closed;
        var lb = $('laps');
        $('lapsMinus').hidden = !closed; $('lapsPlus').hidden = !closed;
        $('lapsBox').textContent = '';
        if (closed) {
          var o = document.createElement('output'); o.id = 'laps'; o.textContent = settings.laps; $('lapsBox').appendChild(o);
          $('lapsMinus').disabled = settings.laps <= 1; $('lapsPlus').disabled = settings.laps >= 9;
          $('lapsBox').parentNode.style.gridTemplateColumns = '52px 1fr 52px';
        } else {
          var n = document.createElement('div'); n.className = 'note'; n.textContent = 'Départ A, arrivée B';
          $('lapsBox').appendChild(n);
          $('lapsBox').parentNode.style.gridTemplateColumns = '1fr';
        }
        var seg = $('seg'); seg.textContent = '';
        for (var k = 1; k <= 4; k++) {
          (function (k) {
            var b = document.createElement('button'); b.type = 'button'; b.textContent = k;
            if (k === settings.players) b.className = 'on';
            b.addEventListener('click', function () { settings.players = k; saveSettings(); renderSetup(); });
            seg.appendChild(b);
          })(k);
        }
        var nm = $('names'); nm.textContent = '';
        for (var j = 0; j < settings.players; j++) {
          (function (j) {
            var row = document.createElement('label'); row.className = 'name';
            var d = carIcon(COLORS[j], 34);
            var inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 20; inp.autocomplete = 'off';
            inp.placeholder = 'Joueur ' + (j + 1) + ' (' + COLOR_NAMES[j] + ')'; inp.value = settings.names[j] || '';
            inp.setAttribute('aria-label', 'Nom du joueur ' + (j + 1));
            inp.addEventListener('input', function () { settings.names[j] = inp.value; saveSettings(); });
            row.appendChild(d); row.appendChild(inp); nm.appendChild(row);
          })(j);
        }
      }
      $('lapsMinus').addEventListener('click', function () { settings.laps = Math.max(1, settings.laps - 1); saveSettings(); renderSetup(); });
      $('lapsPlus').addEventListener('click', function () { settings.laps = Math.min(9, settings.laps + 1); saveSettings(); renderSetup(); });

      // ----- Course : canvas, caméra -----
      var cv = $('cv'), ctx = cv.getContext('2d');
      var W = 300, H = 300, dpr = 1;
      var cam = { cx: 0, cy: 0, s: 20 }, camTarget = { cx: 0, cy: 0, s: 20 };
      var overview = false, selected = null, raf = 0, quitArmed = false, quitTimer = null;

      function sizeCanvas() {
        var r = $('stage').getBoundingClientRect();
        if (!r.width || !r.height) return;
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        W = Math.round(r.width); H = Math.round(r.height);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        if (game) { computeTarget(); snapCam(); requestDraw(); }
      }
      window.addEventListener('resize', sizeCanvas);
      if (window.ResizeObserver) new ResizeObserver(sizeCanvas).observe($('stage'));

      function computeTarget() {
        if (!game) return;
        var tr = game.track;
        if (overview) {
          var bb = tr.bbox;
          camTarget = { cx: (bb.x0 + bb.x1) / 2, cy: (bb.y0 + bb.y1) / 2, s: Math.min(W / (bb.x1 - bb.x0), H / (bb.y1 - bb.y0)) };
          return;
        }
        var pl = game.players[game.turn];
        var ax = pl.pos[0], ay = pl.pos[1], bx = ax + pl.v[0], by = ay + pl.v[1];
        var w = Math.max(Math.abs(bx - ax) + 4.4, 9), h = Math.max(Math.abs(by - ay) + 4.4, 9);
        camTarget = { cx: (ax + bx) / 2, cy: (ay + by) / 2, s: Math.max(8, Math.min(40, W / w, H / h)) };
      }
      function snapCam() { cam = { cx: camTarget.cx, cy: camTarget.cy, s: camTarget.s }; }

      function requestDraw() { if (!raf) raf = requestAnimationFrame(frame); }
      function frame() {
        raf = 0;
        if (!game || current !== 'play') return;
        var k = 0.22, moving = false;
        ['cx', 'cy', 's'].forEach(function (p) {
          var d = camTarget[p] - cam[p];
          if (Math.abs(d) > (p === 's' ? 0.05 : 0.01)) { cam[p] += d * k; moving = true; } else cam[p] = camTarget[p];
        });
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawGame(ctx, game, cam, W, H, selected, !overview);
        if (moving) requestDraw();
      }

      // ----- Course : déroulement -----
      function beginTurn(animate) {
        selected = null;
        var pl = game.players[game.turn];
        $('whoDot').textContent = ''; $('whoDot').appendChild(carIcon(pl.color, 40));
        $('whoName').textContent = pl.name;
        $('speed').textContent = '';
        var b = document.createElement('b');
        b.textContent = fmtSpeed(pl.v) + ' c/t';
        $('speed').appendChild(document.createTextNode('Vitesse '));
        $('speed').appendChild(b);
        $('ok').disabled = true; $('ok').textContent = 'Valider';
        if (pl.off) setStatus('Hors piste ! Manœuvrez (2 c/t maxi) et rentrez sur la route en amont de la zone rouge.', true);
        else setStatus('Touchez la carte pour zoomer et jouer votre tour.');
        // chaque tour commence par la vue d'ensemble ; un toucher amène à la vue zoomée pour jouer
        overview = true;
        $('view').classList.add('on'); $('view').textContent = 'Suivre';
        renderChips();
        computeTarget();
        if (!animate) snapCam();
        requestDraw();
      }
      // vitesse = longueur du vecteur, en carreaux par tour (c/t)
      function fmtSpeed(v) {
        var n = Math.round(Math.hypot(v[0], v[1]) * 10) / 10;
        return String(n).replace('.', ',');
      }
      function setStatus(t, warn) { var e = $('status'); e.textContent = t; e.className = 'status' + (warn ? ' warn' : ''); }
      function renderChips() {
        var box = $('chips'); box.textContent = '';
        game.players.forEach(function (pl, i) {
          var c = document.createElement('div');
          c.className = 'chip' + (i === game.turn ? ' cur' : '');
          var d = carIcon(pl.color, 22);
          var n = document.createElement('span'); n.className = 'nm'; n.textContent = pl.name;
          var l = document.createElement('span');
          l.textContent = game.track.closed ? Math.max(1, Math.min(pl.crossings + 1, game.laps)) + '/' + game.laps : '';
          c.appendChild(d); c.appendChild(n); c.appendChild(l);
          box.appendChild(c);
        });
      }

      function startGame() {
        var def = TRACKS[settings.track], tr = TRACK_BY_ID[def.id];
        var names = [];
        for (var i = 0; i < settings.players; i++) names.push((settings.names[i] || '').trim() || ('Joueur ' + (i + 1)));
        game = newGame(tr, settings.laps, names);
        show('play');
        beginTurn(false);
      }

      function pick(clientX, clientY) {
        var r = cv.getBoundingClientRect();
        var wx = (clientX - r.left - W / 2) / cam.s + cam.cx, wy = (clientY - r.top - H / 2) / cam.s + cam.cy;
        var best = null, bd = 1.15;
        game.cands.forEach(function (c) {
          if (!SELECTABLE[c.type]) return;
          var d = Math.hypot(c.x - wx, c.y - wy);
          if (d < bd) { bd = d; best = c; }
        });
        return best;
      }

      cv.addEventListener('click', function (e) {
        if (!game || game.over) return;
        if (overview) { setOverview(false); return; }
        var c = pick(e.clientX, e.clientY);
        if (!c) { return; }
        if (selected && selected.x === c.x && selected.y === c.y) { commit(); return; }
        selected = c;
        $('ok').disabled = false;
        var me = game.players[game.turn];
        var nv = [c.x - me.pos[0], c.y - me.pos[1]];
        var flag = c.cross > 0 ? ' — ligne d’arrivée franchie !' : '';
        if (c.type === 'exit') {
          $('ok').textContent = 'Valider (sortie)';
          setStatus('Sortie de route : vous finirez hors piste, vitesse nulle. Ensuite 2 c/t maxi pour rentrer en amont.', true);
        } else if (c.type === 'stop') {
          $('ok').textContent = 'Valider';
          setStatus('Aucun point jouable : vous vous arrêtez sur place.');
        } else {
          $('ok').textContent = 'Valider';
          setStatus((c.type === 'reentry' ? 'Retour sur la route. ' : '') + 'Nouvelle vitesse ' + fmtSpeed(nv) + ' c/t' + flag + '. Valider pour jouer.');
        }
        requestDraw();
      });

      function setOverview(on) {
        overview = on; $('view').classList.toggle('on', on);
        $('view').textContent = on ? 'Suivre' : 'Vue d’ensemble';
        computeTarget(); requestDraw();
      }
      $('view').addEventListener('click', function () { if (game) setOverview(!overview); });

      function commit() {
        if (!game || game.over || !selected) return;
        var c = selected;
        applyMove(game, c);
        if (game.over) { finishGame(); return; }
        beginTurn(true);
      }
      $('ok').addEventListener('click', commit);

      // ----- Fin de course -----
      function fmt(t) { return (Math.round(t * 10) / 10).toFixed(1).replace('.', ','); }

      function finishGame() {
        var rk = ranking(game);
        var def = game.track;
        rk.fin.forEach(function (p) {
          DB.records.add({
            nom: p.name, circuit: def.id, tours: game.laps, temps: Math.round(p.temps * 10) / 10,
            joueurs: game.players.length, date: Date.now()
          });
        });
        var ol = $('ranks'); ol.textContent = '';
        function row(p, pos, dnf) {
          var li = document.createElement('li'); li.className = 'rank' + (dnf ? ' dnf' : '');
          var a = document.createElement('span'); a.className = 'pos'; a.textContent = dnf ? '–' : pos;
          var d = carIcon(p.color, 34);
          var n = document.createElement('span'); n.className = 'nm'; n.textContent = p.name;
          var t = document.createElement('span'); t.className = 'tm';
          t.textContent = dnf ? 'en course' : fmt(p.temps) + ' coups';
          var sm = document.createElement('small');
          sm.textContent = p.crashCount ? p.crashCount + ' sortie' + (p.crashCount > 1 ? 's' : '') + ' de route' : 'sans faute';
          t.appendChild(sm);
          li.appendChild(a); li.appendChild(d); li.appendChild(n); li.appendChild(t);
          ol.appendChild(li);
        }
        rk.fin.forEach(function (p, i) { row(p, i + 1, false); });
        rk.dnf.forEach(function (p) { row(p, 0, true); });
        var title = $('resTitle'); title.textContent = '';
        title.appendChild(document.createTextNode(rk.fin.length > 1 || game.players.length > 1 ? 'Victoire de ' : 'Arrivée de '));
        var em = document.createElement('em'); em.textContent = rk.fin[0].name; title.appendChild(em);
        show('result');
      }
      $('again').addEventListener('click', function () { startGame(); });
      $('hofBtn').addEventListener('click', function () { hofFor(settings.track, settings.laps); show('hof'); });
      $('hofBtn2').addEventListener('click', function () { hofFor(TRACKS.map(function (t) { return t.id; }).indexOf(game.track.id), game.laps); show('hof'); });

      // ----- Hall of Fame -----
      var hof = { track: 0, laps: 2 };
      function hofFor(ti, laps) { hof.track = Math.max(0, ti); hof.laps = laps; }
      function renderHof() {
        var st = $('hofTrack'), sl = $('hofLaps');
        st.textContent = '';
        TRACKS.forEach(function (d, i) { var o = document.createElement('option'); o.value = i; o.textContent = d.nom; st.appendChild(o); });
        st.value = hof.track;
        var closed = TRACK_BY_ID[TRACKS[hof.track].id].closed;
        sl.textContent = '';
        var maxL = closed ? 9 : 1;
        if (!closed) hof.laps = 1; else if (hof.laps < 1) hof.laps = 1;
        for (var l = 1; l <= maxL; l++) { var o = document.createElement('option'); o.value = l; o.textContent = closed ? l + (l > 1 ? ' tours' : ' tour') : 'A → B'; sl.appendChild(o); }
        sl.value = hof.laps; sl.disabled = !closed;
        var id = TRACKS[hof.track].id;
        var list = DB.records.list().filter(function (r) { return r.circuit === id && r.tours === hof.laps; })
          .sort(function (a, b) { return a.temps - b.temps || (a.date || 0) - (b.date || 0); }).slice(0, 10);
        var ol = $('hofList'); ol.textContent = '';
        list.forEach(function (r, i) {
          var li = document.createElement('li'); li.className = 'rank';
          var a = document.createElement('span'); a.className = 'pos'; a.textContent = i + 1;
          var d = i === 0 ? carIcon('#d9962f', 34) : document.createElement('span');
          var n = document.createElement('span'); n.className = 'nm'; n.textContent = r.nom;
          var t = document.createElement('span'); t.className = 'tm'; t.textContent = fmt(r.temps) + ' coups';
          var sm = document.createElement('small');
          sm.textContent = (r.date ? new Date(r.date).toLocaleDateString('fr-FR') : '') + (r.joueurs > 1 ? ' · ' + r.joueurs + ' joueurs' : ' · seul');
          t.appendChild(sm);
          li.appendChild(a); li.appendChild(d); li.appendChild(n); li.appendChild(t); ol.appendChild(li);
        });
        $('hofEmpty').hidden = list.length > 0;
      }
      $('hofTrack').addEventListener('change', function () { hof.track = +$('hofTrack').value; renderHof(); });
      $('hofLaps').addEventListener('change', function () { hof.laps = +$('hofLaps').value; renderHof(); });
      DB.records.subscribe(function () { if (current === 'hof') renderHof(); });

      // ----- Navigation -----
      $('back').addEventListener('click', function () {
        if (current === 'setup') { location.href = './'; return; }
        if (current === 'play') {
          if (!quitArmed) {
            quitArmed = true; $('back').textContent = 'Quitter ? Oui';
            clearTimeout(quitTimer);
            quitTimer = setTimeout(function () { quitArmed = false; if (current === 'play') $('back').textContent = '← Quitter'; }, 3000);
            return;
          }
          game = null;
        }
        show('setup'); renderSetup();
      });
      $('go').addEventListener('click', startGame);

      // Pour les tests automatiques
      window.__course = { distToTrack: distToTrack, arcOf: arcOf, wrapDiff: wrapDiff, fmtSpeed: fmtSpeed, TRACKS: TRACKS, prepared: TRACK_BY_ID, onRoad: onRoad, startPositions: startPositions, newGame: newGame, applyMove: applyMove, candidatesFor: candidatesFor, resolveMove: resolveMove, ranking: ranking, get game() { return game; } };

      DB.showErrors();
      DB.gate({ section: 'course', mount: $('gate') });
      renderSetup();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
