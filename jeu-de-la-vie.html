<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeu de la vie — Thierry Morin</title>
  <meta name="description" content="Jeu de la vie de Conway : dessine un état de départ et regarde-le évoluer.">
  <meta name="theme-color" content="#0d0e11">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThyApp">

  <style>
    :root {
      --bg: #0d0e11;
      --ink: #ebe8e1;
      --muted: #8b8b93;
      --paper: #ebe8e1;
      --lilac: #b7a4ea;
      --amber: #f6b564;
      --coral: #ee7f73;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --chrome: 448px; /* hauteur occupée autour du plateau (titre, compteur, boutons…) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Lavis très discret en fond */
    .wash { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); mix-blend-mode: screen; opacity: .22; }
    .blob.lilac { width: 60vmax; height: 50vmax; right: -22vmax; top: -14vmax;
      background: radial-gradient(closest-side, var(--lilac), transparent 72%); }
    .blob.amber { width: 46vmax; height: 40vmax; right: -14vmax; top: 34vh;
      background: radial-gradient(closest-side, var(--amber), transparent 72%); }
    .blob.coral { width: 38vmax; height: 34vmax; left: -16vmax; bottom: -16vmax;
      background: radial-gradient(closest-side, var(--coral), transparent 72%); }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    /* ---------- En-tête ---------- */
    header {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--muted);
    }
    header a {
      justify-self: start;
      color: var(--ink);
      text-decoration: none;
      padding: 12px 12px 12px 0;
      transition: color .3s;
    }
    header a:hover, header a:focus-visible { color: var(--amber); outline: none; }
    header h1 { font: inherit; color: var(--ink); white-space: nowrap; }

    /* ---------- Compteur ---------- */
    .readout {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: .26em;
      font-size: 10px;
      color: var(--muted);
    }
    .readout .num {
      display: block;
      margin-top: 2px;
      font-family: var(--serif);
      font-size: clamp(40px, 11vw, 58px);
      line-height: 1;
      letter-spacing: 0;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .readout .pop { text-align: right; }
    .readout .pop .num { font-size: clamp(22px, 6vw, 30px); color: var(--muted); }

    /* ---------- Plateau ---------- */
    .board {
      width: min(100%, 640px, calc(100dvh - var(--chrome)));
      min-width: 260px;
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(235, 232, 225, .25), 0 18px 60px -12px rgba(0, 0, 0, .7), 0 0 80px -20px rgba(246, 181, 100, .25);
      transition: box-shadow .6s ease;
    }
    body.running .board {
      box-shadow: 0 0 0 1px rgba(246, 181, 100, .6), 0 18px 60px -12px rgba(0, 0, 0, .7), 0 0 90px -10px rgba(246, 181, 100, .38);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 2px;
      touch-action: none;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }
    body.running canvas, body.panmode canvas { cursor: grab; }

    /* ---------- Zoom ---------- */
    .zoombar {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 1fr 1fr 2fr 2fr;
      gap: 8px;
    }
    .zoombar button {
      height: 46px;
      padding: 0;
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--ink);
      background: rgba(13, 14, 17, .55);
      border: 1px solid rgba(235, 232, 225, .28);
    }
    .zoombar button.sym { font-size: 22px; letter-spacing: 0; line-height: 1; }
    .zoombar button:hover:not(:disabled), .zoombar button:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
    .zoombar button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); background: rgba(246, 181, 100, .1); }

    .speedbar {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .speedbar button { height: 40px; padding: 0; font-size: 13px; letter-spacing: .08em; color: var(--ink);
      background: rgba(13, 14, 17, .55); border: 1px solid rgba(235, 232, 225, .28); }
    .speedbar button:hover:not(:disabled), .speedbar button:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
    .speedbar .speed {
      text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    }
    .speedbar .speed b { color: var(--ink); font-weight: 400; margin-left: .6em; }

    .status {
      min-height: 1.4em;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
    }
    .tip {
      max-width: 34em;
      text-align: center;
      font-family: var(--mono);
      font-size: 9.5px;
      line-height: 1.7;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(139, 139, 147, .7);
    }

    /* ---------- Boutons ---------- */
    .controls {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      margin-top: auto;
    }
    button {
      appearance: none;
      cursor: pointer;
      height: 54px;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: .32em;
      text-transform: uppercase;
      padding-left: .32em;
      transition: border-color .3s, color .3s, opacity .3s, transform .15s, background .3s;
    }
    button:active:not(:disabled) { transform: scale(.985); }
    button:disabled { opacity: .35; cursor: not-allowed; }

    #go {
      border: 0;
      color: var(--bg);
      font-weight: 700;
      background: linear-gradient(100deg, var(--lilac), var(--amber) 55%, var(--coral));
    }
    #go.is-pause {
      color: var(--ink);
      font-weight: 400;
      background: transparent;
      border: 1px solid var(--amber);
    }
    #clear {
      color: var(--ink);
      background: rgba(13, 14, 17, .55);
      border: 1px solid rgba(235, 232, 225, .28);
    }
    #clear:hover:not(:disabled), #clear:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
    #go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    @media (max-height: 760px) {
      :root { --chrome: 398px; }
      .tip { display: none; }
    }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true">
    <div class="blob lilac"></div>
    <div class="blob amber"></div>
    <div class="blob coral"></div>
  </div>

  <div class="page">
    <header>
      <a href="./" aria-label="Retour au menu">← Menu</a>
      <h1>Jeu de la vie</h1>
      <span></span>
    </header>

    <div class="readout" aria-live="off">
      <div>Round<span class="num" id="round">0</span></div>
      <div class="pop">Vivants<span class="num" id="pop">0</span></div>
    </div>

    <div class="board">
      <canvas id="board" aria-label="Grille de 64 par 64 carrés. Touchez ou glissez pour noircir des carrés." role="img"></canvas>
    </div>

    <div class="zoombar" role="group" aria-label="Zoom et déplacement">
      <button id="zoomOut" type="button" class="sym" aria-label="Dézoomer">−</button>
      <button id="zoomIn" type="button" class="sym" aria-label="Zoomer">+</button>
      <button id="fit" type="button">Tout voir</button>
      <button id="pan" type="button" aria-pressed="false">Déplacer</button>
    </div>

    <div class="speedbar" role="group" aria-label="Vitesse">
      <button id="slower" type="button" aria-label="Deux fois plus lent">÷2</button>
      <div class="speed" id="speedLabel" aria-live="polite">Vitesse<b>×1</b></div>
      <button id="faster" type="button" aria-label="Deux fois plus rapide">×2</button>
    </div>

    <p class="status" id="status" role="status">Touchez ou glissez pour noircir des carrés, puis GO.</p>
    <p class="tip">Zoom : pincez, molette ou + / −<br>Déplacement : deux doigts, ou le bouton « Déplacer »</p>

    <div class="controls">
      <button id="go" type="button" disabled>GO</button>
      <button id="clear" type="button">Effacer</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var N = 64;            // grille de 64 x 64
      var BASE_TICK = 500;   // vitesse ×1 : un round toutes les 0,5 seconde
      var MIN_S = -3, MAX_S = 4;  // de ÷8 à ×16 (puissances de 2)
      var speedExp = 0;
      function tick() { return BASE_TICK / Math.pow(2, speedExp); }
      var MIN_Z = 1, MAX_Z = 8, STEP_Z = 1.6;
      var PAPER = '#ebe8e1', INK = '#0d0e11';
      var MSG_DRAW = 'Touchez ou glissez pour noircir des carrés, puis GO.';

      var grid = new Uint8Array(N * N);
      var next = new Uint8Array(N * N);
      var round = 0, alive = 0, running = false, timer = null;

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var elRound = document.getElementById('round');
      var elPop = document.getElementById('pop');
      var elStatus = document.getElementById('status');
      var btnGo = document.getElementById('go');
      var btnClear = document.getElementById('clear');
      var btnIn = document.getElementById('zoomIn');
      var btnOut = document.getElementById('zoomOut');
      var btnFit = document.getElementById('fit');
      var btnPan = document.getElementById('pan');

      // ---------- Vue : zoom et décalage ----------
      // z = facteur de zoom (1 = grille entière visible).
      // x, y = décalage en px CSS du coin visible, dans le plan zoomé.
      var view = { z: 1, x: 0, y: 0 };
      var viewCss = 320, dpr = 1;
      var mode = 'paint';    // 'paint' : un doigt dessine / 'pan' : un doigt déplace

      function cellCss() { return viewCss / N * view.z; }

      function clampView() {
        var max = viewCss * (view.z - 1);
        view.x = Math.min(max, Math.max(0, view.x));
        view.y = Math.min(max, Math.max(0, view.y));
      }

      // zoom en gardant fixe le point (fx, fy) du canvas (px CSS)
      function zoomAt(newZ, fx, fy) {
        newZ = Math.min(MAX_Z, Math.max(MIN_Z, newZ));
        var k = newZ / view.z;
        view.x = (view.x + fx) * k - fx;
        view.y = (view.y + fy) * k - fy;
        view.z = newZ;
        clampView();
        draw();
        updateUI();
      }

      // ---------- Dessin ----------
      function resize() {
        dpr = window.devicePixelRatio || 1;
        viewCss = canvas.getBoundingClientRect().width || 320;
        canvas.width = canvas.height = Math.max(1, Math.round(viewCss * dpr));
        clampView();
        draw();
      }

      function draw() {
        var W = canvas.width;
        var c = cellCss() * dpr, ox = view.x * dpr, oy = view.y * dpr;
        var x, y, i, p, px, py, pw, ph;
        var x0 = Math.max(0, Math.floor(ox / c)), x1 = Math.min(N - 1, Math.floor((ox + W - 1) / c));
        var y0 = Math.max(0, Math.floor(oy / c)), y1 = Math.min(N - 1, Math.floor((oy + W - 1) / c));

        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, W, W);

        ctx.fillStyle = INK;
        for (y = y0; y <= y1; y++) {
          py = Math.round(y * c - oy);
          ph = Math.round((y + 1) * c - oy) - py;
          for (x = x0; x <= x1; x++) {
            if (grid[y * N + x]) {
              px = Math.round(x * c - ox);
              pw = Math.round((x + 1) * c - ox) - px;
              ctx.fillRect(px, py, pw, ph);
            }
          }
        }

        // quadrillage au crayon : lignes fines, blocs de 8 plus marqués
        ctx.lineWidth = 1;
        ctx.strokeStyle = cellCss() >= 16 ? 'rgba(13,14,17,.26)' : 'rgba(13,14,17,.15)';
        ctx.beginPath();
        for (i = x0; i <= x1 + 1; i++) {
          if (i % 8 === 0) continue;
          p = Math.round(i * c - ox) + .5;
          ctx.moveTo(p, 0); ctx.lineTo(p, W);
        }
        for (i = y0; i <= y1 + 1; i++) {
          if (i % 8 === 0) continue;
          p = Math.round(i * c - oy) + .5;
          ctx.moveTo(0, p); ctx.lineTo(W, p);
        }
        ctx.stroke();

        ctx.lineWidth = Math.max(1, Math.round(dpr * .75));
        ctx.strokeStyle = 'rgba(13,14,17,.38)';
        ctx.beginPath();
        for (i = Math.max(8, Math.ceil(x0 / 8) * 8); i <= x1 + 1 && i < N; i += 8) {
          p = Math.round(i * c - ox) + .5;
          ctx.moveTo(p, 0); ctx.lineTo(p, W);
        }
        for (i = Math.max(8, Math.ceil(y0 / 8) * 8); i <= y1 + 1 && i < N; i += 8) {
          p = Math.round(i * c - oy) + .5;
          ctx.moveTo(0, p); ctx.lineTo(W, p);
        }
        ctx.stroke();
      }

      function countAlive() {
        var n = 0;
        for (var i = 0; i < grid.length; i++) n += grid[i];
        return n;
      }

      function say(text) { elStatus.textContent = text; }

      function updateUI() {
        elRound.textContent = round;
        elPop.textContent = alive;
        btnGo.textContent = running ? 'Pause' : 'GO';
        btnGo.classList.toggle('is-pause', running);
        btnGo.disabled = !running && alive === 0;
        btnClear.disabled = running;
        btnIn.disabled = view.z >= MAX_Z - 0.001;
        btnOut.disabled = view.z <= MIN_Z + 0.001;
        btnFit.disabled = view.z <= MIN_Z + 0.001;
        document.body.classList.toggle('running', running);
        document.body.classList.toggle('panmode', mode === 'pan');
      }

      function refresh() {
        alive = countAlive();
        draw();
        updateUI();
      }

      // ---------- Règles du jeu de la vie ----------
      function step() {
        var x, y, dx, dy, nx, ny, n, i, v;
        for (y = 0; y < N; y++) {
          for (x = 0; x < N; x++) {
            n = 0;
            for (dy = -1; dy <= 1; dy++) {
              ny = y + dy;
              if (ny < 0 || ny >= N) continue;
              for (dx = -1; dx <= 1; dx++) {
                if (!dx && !dy) continue;
                nx = x + dx;
                if (nx < 0 || nx >= N) continue;
                n += grid[ny * N + nx];
              }
            }
            i = y * N + x;
            v = grid[i];
            // vivant : reste vivant avec 2 ou 3 voisins (sinon meurt : <2 ou >3)
            // mort : devient vivant avec exactement 3 voisins
            next[i] = v ? ((n === 2 || n === 3) ? 1 : 0) : (n === 3 ? 1 : 0);
          }
        }
        var t = grid; grid = next; next = t;
        round++;
        alive = countAlive();
        draw();

        if (alive === 0) {
          stop();
          say('Plus aucun carré vivant. Effacez, puis dessinez un nouveau départ.');
        }
        updateUI();
      }

      function start() {
        if (running || alive === 0) return;
        running = true;
        pending = null; painting = false;
        say('En cours. Un doigt déplace la grille.');
        timer = setInterval(step, tick());
        updateUI();
      }

      function setSpeed(e) {
        speedExp = Math.max(MIN_S, Math.min(MAX_S, e));
        var f = Math.pow(2, speedExp);
        document.getElementById('speedLabel').lastChild.textContent = f >= 1 ? '×' + f : '÷' + (1 / f);
        document.getElementById('slower').disabled = speedExp <= MIN_S;
        document.getElementById('faster').disabled = speedExp >= MAX_S;
        if (running) { clearInterval(timer); timer = setInterval(step, tick()); }  // s'applique tout de suite
      }
      document.getElementById('slower').addEventListener('click', function () { setSpeed(speedExp - 1); });
      document.getElementById('faster').addEventListener('click', function () { setSpeed(speedExp + 1); });
      setSpeed(0);

      function stop() {
        running = false;
        clearInterval(timer);
        timer = null;
        if (alive > 0) say('En pause. Vous pouvez modifier la grille ou reprendre avec GO.');
        updateUI();
      }

      function clearAll() {
        if (running) return;
        grid.fill(0);
        round = 0;
        alive = 0;
        draw();
        say(MSG_DRAW);
        updateUI();
      }

      // ---------- Saisie ----------
      // Un doigt : dessine (toucher ou glisser) ou déplace la grille (mode « Déplacer », ou pendant la simulation).
      // Deux doigts : pincement pour zoomer, glissement pour déplacer.
      var pointers = new Map();     // pointerId -> {x, y} (coordonnées écran)
      var pending = null;           // appui en attente : un tap, ou le début d'un tracé
      var painting = false, paintVal = 1, lastX = 0, lastY = 0;
      var panLast = null;           // dernier point d'un déplacement à un doigt
      var gesture = null;           // état du geste à deux doigts

      function canvasPoint(e) {
        var r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      function cellAt(e) {
        var p = canvasPoint(e), c = cellCss();
        var x = Math.floor((p.x + view.x) / c);
        var y = Math.floor((p.y + view.y) / c);
        return { x: Math.min(N - 1, Math.max(0, x)), y: Math.min(N - 1, Math.max(0, y)) };
      }

      // trace une ligne de cellules (Bresenham) pour ne laisser aucun trou en glissant
      function paintLine(x0, y0, x1, y1) {
        var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
        var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
        var err = dx + dy, e2;
        for (;;) {
          grid[y0 * N + x0] = paintVal;
          if (x0 === x1 && y0 === y1) break;
          e2 = 2 * err;
          if (e2 >= dy) { err += dy; x0 += sx; }
          if (e2 <= dx) { err += dx; y0 += sy; }
        }
      }

      function beginStroke(cx, cy) {
        if (alive === 0) round = 0;     // nouveau départ : on repart de zéro
        painting = true;
        lastX = cx; lastY = cy;
        paintLine(cx, cy, cx, cy);
        refresh();
        say(MSG_DRAW);
      }

      function pinchState() {
        var pts = Array.from(pointers.values());
        var a = pts[0], b = pts[1];
        return {
          d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
          mx: (a.x + b.x) / 2,
          my: (a.y + b.y) / 2
        };
      }

      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2) {            // deuxième doigt : on annule tout tracé et on passe en zoom
          pending = null; painting = false; panLast = null;
          gesture = pinchState();
          return;
        }
        if (pointers.size > 2) return;

        if (running || mode === 'pan') {      // un doigt déplace la grille
          panLast = { x: e.clientX, y: e.clientY };
          return;
        }
        var c = cellAt(e);
        paintVal = grid[c.y * N + c.x] ? 0 : 1;   // le premier carré touché décide : noircir ou effacer
        pending = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: c.x, cy: c.y };
      });

      canvas.addEventListener('pointermove', function (e) {
        var p = pointers.get(e.pointerId);
        if (!p) return;
        p.x = e.clientX; p.y = e.clientY;

        if (pointers.size === 2 && gesture) {
          var g = pinchState(), r = canvas.getBoundingClientRect();
          view.x -= g.mx - gesture.mx;
          view.y -= g.my - gesture.my;
          zoomAt(view.z * g.d / gesture.d, g.mx - r.left, g.my - r.top);
          gesture = g;
          return;
        }
        if (pointers.size !== 1) return;

        if (panLast) {
          view.x -= e.clientX - panLast.x;
          view.y -= e.clientY - panLast.y;
          panLast = { x: e.clientX, y: e.clientY };
          clampView();
          draw();
          return;
        }

        if (pending && pending.id === e.pointerId) {
          if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < 6) return;  // simple tremblement du doigt
          beginStroke(pending.cx, pending.cy);
          pending = null;
        }
        if (painting) {
          var c = cellAt(e);
          if (c.x === lastX && c.y === lastY) return;
          paintLine(lastX, lastY, c.x, c.y);
          lastX = c.x; lastY = c.y;
          refresh();
        }
      });

      function release(e) {
        pointers.delete(e.pointerId);
        if (pending && pending.id === e.pointerId) {
          if (e.type === 'pointerup') beginStroke(pending.cx, pending.cy);   // simple tap
          pending = null;
        }
        if (pointers.size < 2) gesture = null;
        if (pointers.size === 0) { painting = false; panLast = null; }
      }
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);

      // molette / pavé tactile : zoom autour du curseur
      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
        var r = canvas.getBoundingClientRect();
        zoomAt(view.z * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
      }, { passive: false });

      // ---------- Boutons ----------
      btnIn.addEventListener('click', function () { zoomAt(view.z * STEP_Z, viewCss / 2, viewCss / 2); });
      btnOut.addEventListener('click', function () { zoomAt(view.z / STEP_Z, viewCss / 2, viewCss / 2); });
      btnFit.addEventListener('click', function () { view.z = 1; view.x = 0; view.y = 0; draw(); updateUI(); });
      btnPan.addEventListener('click', function () {
        mode = mode === 'pan' ? 'paint' : 'pan';
        btnPan.setAttribute('aria-pressed', mode === 'pan' ? 'true' : 'false');
        pending = null; painting = false;
        if (!running) say(mode === 'pan' ? 'Mode déplacement : un doigt fait glisser la grille.' : MSG_DRAW);
        updateUI();
      });
      btnGo.addEventListener('click', function () { running ? stop() : start(); });
      btnClear.addEventListener('click', clearAll);

      if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
      else window.addEventListener('resize', resize);
      resize();
      updateUI();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
